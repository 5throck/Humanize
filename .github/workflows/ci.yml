name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Smoke test: rules ↔ references.json registry consistency
      - name: Run smoke tests
        run: bun test.mjs

      # Syntax check via bun build — parse without executing. app.js is a
      # browser-only IIFE that bun test.mjs cannot import; chunking.js and
      # mcp-server.mjs are also loaded by the tests but re-checked cheaply.
      - name: Syntax-check app.js / chunking.js / mcp-server.mjs
        run: |
          bun build app.js --outfile /dev/null
          bun build chunking.js --outfile /dev/null
          bun build mcp-server.mjs --target=bun --outfile /dev/null

      # serve.ts must type-strip/build cleanly (bun runs it without a build
      # step, so this is the closest CI-safe equivalent of "server boots")
      - name: Build-check serve.ts
        run: bun build serve.ts --target=bun --outdir dist
